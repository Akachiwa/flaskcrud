services:
  mysql:
    image: mysql:8.0
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: faztpassword
      MYSQL_DATABASE: flaskcrud
    volumes:
      - ./sql/db.sql:/docker-entrypoint-initdb.d/db.sql
      - mysql_data:/var/lib/mysql
    ports:
      - "3307:3306"   # 3307 en tu PC para no chocar con un MySQL local
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 5s
      retries: 10
 
  flaskapp:
    build: .
    env_file: .env          # MYSQL_HOST=mysql coincide con el nombre del servicio
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"
    volumes:
      - ./app:/app          # cambios en el código se reflejan sin reconstruir
 
volumes:
  mysql_data:
